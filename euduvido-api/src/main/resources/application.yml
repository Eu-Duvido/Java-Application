spring:
  application:
    name: euduvido-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/euduvido?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:euduvido-jwt-secret-key-32-bytes!!}
  expiration-ms: 86400000

app:
  storage:
    local:
      path: ${STORAGE_PATH:./uploads}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId:--}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.euduvido.euduvido_api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
